services:
  db:
    image: postgres:16-alpine
    container_name: marketmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketmind}
      POSTGRES_USER: ${POSTGRES_USER:-marketmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - marketmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketmind} -d ${POSTGRES_DB:-marketmind}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  marketmind_pgdata:
